<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>StartUp 101</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#8B5CF6;
    --yellow:#FFD000;
    --green:#01A85F;
    --blue:#0090FF;
    --bg-0:#0B1020;
    --card: rgba(255,255,255,0.045);
    --card-border: rgba(255,255,255,0.09);
    --text-hi: #F5F3FF;
    --text-mid: #C9CBDA;
    --text-low: #8B8FA3;
    --radius: 24px;
    --pulse-speed: 2.4s;
    --pulse-fast: 1.6s;
    --card-blur: 18px;
    --card-density: 1;
    --ease-card: cubic-bezier(.22,1,.36,1);
    --accent-a: #8B5CF6;
    --accent-b: #0090FF;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg-0);
    color: var(--text-hi);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  /* atmosphere background: two crossfading gradient layers + a live canvas */
  .bg-layer{
    position:fixed; inset:0; z-index:0; opacity:0;
    transition: opacity 1.3s ease;
    pointer-events:none;
  }
  .bg-layer.active{ opacity:1; }
  #atmo-canvas{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    width:100vw; height:100vh;
  }
  #vignette{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background: radial-gradient(ellipse at 50% 42%, rgba(5,7,15,0.25) 0%, rgba(5,7,15,0.15) 30%, rgba(5,7,15,0.6) 100%);
  }

  /* scrollable app shell -- prevents any card content from ever being clipped */
  #app{
    position:relative; z-index:3;
    width:100vw; height:100vh;
    overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling: touch;
    display:flex; flex-direction:column; align-items:center;
    padding: 9vh 18px 9vh 18px;
  }
  @media (max-width: 560px){
    #app{ padding: 12vh 14px 10vh 14px; }
  }

  #progress-wrap{
    position:fixed; top:22px; left:50%; transform:translateX(-50%);
    width:min(560px, 82vw);
    z-index:6;
    display:flex; align-items:center; gap:10px;
    opacity:0; pointer-events:none;
    transition: opacity .6s ease;
  }
  #progress-wrap.show{ opacity:1; }
  #progress-track{
    flex:1; height:6px; border-radius:999px;
    background: rgba(255,255,255,0.08);
    overflow:visible;
    position:relative;
  }
  #progress-fill{
    height:100%; border-radius:999px;
    background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
    width:0%;
    position:relative;
    transition: width .6s cubic-bezier(.4,0,.2,1), background 1s ease;
  }
  #progress-fill::after{
    content:''; position:absolute; right:-3px; top:50%; transform:translateY(-50%);
    width:12px; height:12px; border-radius:50%;
    background: var(--accent-b);
    box-shadow: 0 0 10px 3px var(--accent-b);
    animation: pulseDot var(--pulse-fast) ease-in-out infinite;
    transition: background 1s ease, box-shadow 1s ease;
  }
  @keyframes pulseDot{ 0%,100%{ opacity:.75;} 50%{ opacity:1;} }
  #progress-fill::before{
    content:''; position:absolute; inset:0; border-radius:999px;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.55) 8%, transparent 16%);
    background-size: 220% 100%;
    animation: shimmerMove 2.6s linear infinite;
  }
  @keyframes shimmerMove{ 0%{ background-position: -40% 0; } 100%{ background-position: 140% 0; } }
  .tick{
    position:absolute; top:50%; width:6px; height:6px; border-radius:50%;
    background: rgba(255,255,255,0.18); transform:translate(-50%,-50%);
    transition: background .6s ease, box-shadow .6s ease, transform .4s cubic-bezier(.34,1.56,.64,1);
  }
  .tick.hit{
    background: #fff; box-shadow: 0 0 10px 3px var(--accent-b);
    transform:translate(-50%,-50%) scale(1.5);
  }
  #progress-text{
    font-family:'Space Grotesk', sans-serif; font-size:12px; letter-spacing:.05em;
    color: var(--text-low); white-space:nowrap;
  }
  #burst{
    position:fixed; inset:0; z-index:4; pointer-events:none;
    background: radial-gradient(circle at 50% 45%, var(--accent-b) 0%, transparent 60%);
    opacity:0;
  }
  #burst.fire{ animation: burstFlash .55s ease-out; }
  @keyframes burstFlash{ 0%{ opacity:0; } 18%{ opacity:.4; } 100%{ opacity:0; } }

  .screen{
    position:relative; z-index:2;
    width:min(680px, 88vw);
    display:flex; flex-direction:column;
    align-items:center;
    text-align:center;
    animation: riseIn .65s var(--ease-card);
    margin-bottom: 4vh;
  }
  @keyframes riseIn{
    from{ opacity:0; transform: translateY(30px) scale(.97); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  .screen.leaving{ animation: fadeOut .32s cubic-bezier(.4,0,1,1) forwards; }
  @keyframes fadeOut{ to{ opacity:0; transform: translateY(-10px) scale(.94); filter: blur(7px); } }

  /* layout variety for situation cards -- not everything is centered */
  .screen.layout-left{ align-items:flex-start; text-align:left; }
  .screen.layout-left .card{ max-width:640px; }
  .screen.layout-left .moment-eyebrow, .screen.layout-left .situation-tag{ text-align:left; }
  .screen.layout-wide{ width:min(760px, 94vw); }
  .screen.layout-wide .card{ padding-left:calc(46px * var(--card-density)); padding-right:calc(46px * var(--card-density)); }
  .screen.layout-wide .situation-tag{ font-size:16px; }

  /* focus glow behind the behavior word on definition cards */
  .focus-glow{
    position:absolute; width:280px; height:280px; border-radius:50%;
    background: radial-gradient(circle, var(--accent-a) 0%, transparent 70%);
    opacity:.22; filter: blur(30px);
    top:10%; left:50%; transform:translateX(-50%);
    pointer-events:none; z-index:-1;
    animation: focusPulse 3.5s ease-in-out infinite;
  }
  @keyframes focusPulse{ 0%,100%{ opacity:.16; transform:translateX(-50%) scale(1);} 50%{ opacity:.28; transform:translateX(-50%) scale(1.08);} }
  .card{ position:relative; overflow:visible; }

  .brand-tag{
    display:flex; align-items:center; gap:8px;
    font-family:'Space Grotesk', sans-serif; font-size:12.5px; font-weight:600;
    letter-spacing:.14em; text-transform:uppercase; color: #c9b8ff; margin-bottom:26px; opacity:0;
    animation: popReveal .5s var(--ease-card) forwards; animation-delay:.05s;
  }
  .brand-dot{ width:8px; height:8px; border-radius:50%; background: var(--accent-b); box-shadow:0 0 8px 2px var(--accent-b); }

  .wordmark{
    font-family:'Space Grotesk', sans-serif; font-weight:700;
    font-size: clamp(40px, 8vw, 68px);
    letter-spacing:-0.01em;
    background: linear-gradient(120deg, #fff 10%, #d9c8ff 60%, var(--purple) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin:0 0 18px 0;
    opacity:0; animation: popReveal .6s var(--ease-card) forwards; animation-delay:.12s;
  }
  .supporting{
    font-size: clamp(16px, 2.4vw, 19px);
    color: var(--text-mid);
    max-width: 480px;
    margin: 0 0 30px 0;
    line-height:1.5;
    opacity:0; animation: popReveal .6s var(--ease-card) forwards; animation-delay:.22s;
  }
  .micro{
    font-size:13px; color: var(--text-low); margin-top:16px;
    opacity:0; animation: popReveal .6s var(--ease-card) forwards; animation-delay:.4s;
  }
  @keyframes popReveal{ to{ opacity:1; transform: translateY(0); } }

  .mascot-row{
    display:flex; align-items:flex-end; justify-content:center; gap:26px;
    margin: 6px 0 32px 0;
    opacity:0; animation: popReveal .7s var(--ease-card) forwards; animation-delay:.3s;
  }
  .mascot{
    width:58px; height:72px;
    border-radius: 50% 50% 46% 46% / 62% 62% 38% 38%;
    position:relative;
    animation: bob 3.2s ease-in-out infinite;
    box-shadow: 0 10px 26px -6px rgba(0,0,0,0.55);
  }
  .mascot::before, .mascot::after{
    content:''; position:absolute; width:13px; height:24px; border-radius:50%;
    background:inherit; bottom:8px;
  }
  .mascot::before{ left:-8px; transform:rotate(18deg); }
  .mascot::after{ right:-8px; transform:rotate(-18deg); }
  .mascot .eyes{ position:absolute; top:32%; left:50%; transform:translateX(-50%); display:flex; gap:11px; }
  .mascot .eye{ width:5px; height:5px; border-radius:50%; background:#1a1a2e; }
  .mascot .mouth{
    position:absolute; top:48%; left:50%; transform:translateX(-50%);
    width:16px; height:8px; border-bottom:2.5px solid #1a1a2e; border-radius:0 0 16px 16px;
  }
  .m-purple{ background: linear-gradient(160deg, #a78bfa, var(--purple)); animation-delay:0s; }
  .m-yellow{ background: linear-gradient(160deg, #ffe066, var(--yellow)); animation-delay:.3s; width:52px; height:64px; }
  .m-blue{ background: linear-gradient(160deg, #4db8ff, var(--blue)); animation-delay:.6s; }
  .m-green{ background: linear-gradient(160deg, #33d98f, var(--green)); animation-delay:.45s; }
  @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-9px);} }

  button.cta{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600; font-size:17px;
    border:none; cursor:pointer;
    padding:16px 38px;
    border-radius:999px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color:#fff;
    box-shadow: 0 8px 30px rgba(139,92,246,0.45);
    transition: transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease, background 1s ease;
    animation: ctaPulse var(--pulse-speed) ease-in-out infinite;
  }
  button.cta:hover{ transform: translateY(-3px) scale(1.03); box-shadow: 0 14px 36px rgba(139,92,246,0.65); animation:none; }
  button.cta:active{ transform: translateY(0) scale(.96); }
  @keyframes ctaPulse{ 0%,100%{ box-shadow:0 8px 30px rgba(139,92,246,0.45);} 50%{ box-shadow:0 8px 34px rgba(139,92,246,0.7);} }

  button.cta.secondary{
    background: linear-gradient(135deg, var(--yellow), #ffe066);
    color:#1a1200;
    box-shadow: 0 8px 26px rgba(255,208,0,0.28);
    animation:none;
  }
  button.cta.secondary:hover{ box-shadow: 0 14px 32px rgba(255,208,0,0.5); }

  .btn-row{ display:flex; gap:14px; margin-top:8px; flex-wrap:wrap; justify-content:center; }

  .intro-line{
    font-size: clamp(19px, 3vw, 25px);
    line-height:1.55;
    color: var(--text-hi);
    max-width: 560px;
    font-weight:500;
    opacity:0; animation: popReveal .55s var(--ease-card) forwards; animation-delay:.08s;
  }

  .card{
    background: linear-gradient(160deg, var(--card), rgba(255,255,255,0.015));
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    backdrop-filter: blur(var(--card-blur));
    -webkit-backdrop-filter: blur(var(--card-blur));
    padding: calc(38px * var(--card-density)) calc(34px * var(--card-density));
    width:100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    transition: box-shadow .3s ease, backdrop-filter 1.1s ease, padding 1s ease;
  }
  .card:hover{ box-shadow: 0 24px 70px rgba(0,0,0,0.45); }

  .eyebrow{
    font-family:'Space Grotesk', sans-serif;
    font-size:12px; font-weight:600; letter-spacing:.12em;
    color: var(--yellow);
    text-transform:uppercase;
    margin-bottom:14px;
    opacity:0; animation: popReveal .5s var(--ease-card) forwards; animation-delay:.02s;
  }
  .situation-tag{
    font-style:italic; color: var(--text-low); font-size:14px; margin-bottom:22px;
    opacity:0; animation: popReveal .5s var(--ease-card) forwards; animation-delay:.1s;
  }

  .moment-eyebrow{
    font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:600;
    color: var(--purple); letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px;
    opacity:0; animation: popReveal .5s var(--ease-card) forwards; animation-delay:.02s;
  }
  .moment-title{
    font-family:'Space Grotesk', sans-serif; font-weight:700;
    font-size: clamp(24px, 4vw, 34px);
    margin: 0 0 22px 0;
    color:#fff;
  }

  .behavior-name{
    font-family:'Space Grotesk', sans-serif; font-weight:700;
    font-size: clamp(28px, 5vw, 40px);
    color: var(--yellow);
    margin: 0 0 20px 0;
    text-align:left;
    opacity:0; animation: popReveal .55s cubic-bezier(.34,1.56,.64,1) forwards; animation-delay:.12s;
  }

  .body-copy p{
    font-size: 17px; line-height:1.65; color: var(--text-mid); margin: 0 0 16px 0; text-align:left;
    opacity:0; transform:translateY(10px);
    animation: paraIn .5s var(--ease-card) forwards;
  }
  @keyframes paraIn{ to{ opacity:1; transform:translateY(0); } }
  .body-copy p:last-child{ margin-bottom:0; }
  .body-copy p.beat{
    color: var(--yellow);
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:19px;
    transform: translateY(8px) scale(.9);
    animation: beatPop .55s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes beatPop{ from{ opacity:0; transform:translateY(8px) scale(.88);} to{ opacity:1; transform:translateY(0) scale(1);} }

  .bubble{
    display:inline-block;
    position:relative;
    background: linear-gradient(135deg, rgba(0,144,255,0.16), rgba(139,92,246,0.14));
    border: 1px solid rgba(0,144,255,0.3);
    border-radius: 16px 16px 16px 4px;
    padding: 12px 16px;
    color:#EAF4FF;
    font-size:16px;
    margin: 6px 0 14px 0;
    opacity:0; transform: translateY(8px) scale(.92);
    animation: beatPop .5s cubic-bezier(.34,1.56,.64,1) forwards;
    animation-delay:.25s;
  }

  .founder-box{
    margin-top:22px;
    padding: 16px 18px;
    background: rgba(255,208,0,0.055);
    border-radius: 16px;
    text-align:left;
    display:flex; align-items:flex-start; gap:14px;
    opacity:0; animation: popReveal .55s var(--ease-card) forwards; animation-delay:.4s;
  }
  .founder-icon{
    flex-shrink:0; width:34px; height:34px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff8dc, var(--yellow) 65%);
    display:flex; align-items:center; justify-content:center; font-size:16px;
    animation: bulbPulse var(--pulse-speed) ease-in-out infinite;
  }
  @keyframes bulbPulse{
    0%,100%{ box-shadow:0 0 10px 2px rgba(255,208,0,0.35);}
    50%{ box-shadow:0 0 18px 5px rgba(255,208,0,0.65);}
  }
  .founder-quote{
    font-style:italic; color: var(--text-hi); font-size:15.5px; line-height:1.55;
  }

  .transition-line{
    margin-top:22px; font-size:14.5px; color: var(--text-low); font-style:italic; text-align:left;
    opacity:0; animation: popReveal .5s var(--ease-card) forwards; animation-delay:.5s;
  }

  /* ---- founder-box alt presentations (rotate so it never feels mechanical) ---- */
  .founder-box.style-b{ background: rgba(139,92,246,0.06); }
  .founder-box.style-b .founder-icon{ background: radial-gradient(circle at 35% 30%, #ece3ff, var(--purple) 65%); animation: bulbPulse var(--pulse-speed) ease-in-out infinite; }
  .founder-box.style-c{ background: transparent; padding-left:0; border-left:2px solid var(--card-border); border-radius:0; padding-left:16px; }
  .founder-box.style-c .founder-quote{ font-style:normal; }
  .founder-kicker{ font-family:'Space Grotesk', sans-serif; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-low); margin-bottom:4px; }

  /* ---- pattern-break screens: no card chrome, full-bleed typography ---- */
  .break-kicker{
    font-family:'Space Grotesk', sans-serif; font-size:12.5px; font-weight:700; letter-spacing:.18em;
    text-transform:uppercase; color: var(--accent-a); margin-bottom:22px;
    opacity:0; animation: popReveal .5s var(--ease-card) forwards; animation-delay:.05s;
  }
  .break-line{
    font-size: clamp(20px, 3.6vw, 30px); line-height:1.5; color: var(--text-hi); font-weight:600;
    max-width: 600px; margin: 0 0 14px 0;
    opacity:0; animation: popReveal .55s var(--ease-card) forwards;
  }
  .break-line.sub{ font-size: clamp(16px,2.4vw,19px); font-weight:400; color: var(--text-mid); }
  .break-line.hero{ font-family:'Space Grotesk', sans-serif; font-size: clamp(30px,5.2vw,46px); font-weight:700;
    background: linear-gradient(120deg, #fff 10%, var(--accent-a) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; }

  .myth-block{ text-align:left; width:100%; max-width:560px; }
  .myth-label{ font-family:'Space Grotesk', sans-serif; font-size:12px; font-weight:700; letter-spacing:.1em;
    text-transform:uppercase; color:#ff8a8a; margin-bottom:6px; opacity:0;
    animation: popReveal .5s var(--ease-card) forwards; animation-delay:.05s; }
  .myth-statement{ font-size:20px; font-weight:600; color:var(--text-mid); text-decoration: line-through;
    text-decoration-color: rgba(255,138,138,0.5); margin-bottom:26px; opacity:0;
    animation: popReveal .5s var(--ease-card) forwards; animation-delay:.15s; }
  .reality-label{ font-family:'Space Grotesk', sans-serif; font-size:12px; font-weight:700; letter-spacing:.1em;
    text-transform:uppercase; color: var(--green); margin-bottom:6px; opacity:0;
    animation: popReveal .5s var(--ease-card) forwards; animation-delay:.55s; }
  .reality-text p{ font-size:18px; line-height:1.6; color:var(--text-hi); margin:0 0 8px 0; opacity:0;
    animation: popReveal .5s var(--ease-card) forwards; }

  .phrase-quote{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size: clamp(22px,4vw,30px);
    color:#fff; margin-bottom:22px; opacity:0; animation: popReveal .55s cubic-bezier(.34,1.56,.64,1) forwards; animation-delay:.1s; }

  /* ---- opening world-building: notification chips ---- */
  .chip-row{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:440px; margin: 26px auto 0 auto; }
  .chip{ font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:600; padding:9px 15px;
    border-radius:999px; background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12);
    color: var(--text-mid); opacity:0; transform: translateY(6px) scale(.9);
    animation: chipIn .5s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes chipIn{ to{ opacity:1; transform: translateY(0) scale(1); } }

  /* ---- explore widget (moment 1) ---- */
  .explore-box{ margin-top:22px; padding:16px 18px; background:rgba(255,255,255,0.03); border-radius:16px;
    text-align:left; opacity:0; animation: popReveal .5s var(--ease-card) forwards; animation-delay:.55s; }
  .explore-label{ font-size:11px; font-family:'Space Grotesk',sans-serif; letter-spacing:.1em; text-transform:uppercase;
    color:var(--text-low); margin-bottom:10px; }
  .explore-instruction{ font-size:16px; line-height:1.6; color: var(--text-hi); }
  .explore-hot{ text-decoration: underline dotted rgba(255,208,0,0.6); text-underline-offset:3px; cursor:pointer;
    color: var(--yellow); font-weight:600; }
  .explore-reveal{ font-size:13.5px; color: var(--text-low); font-style:italic; margin-top:8px; display:none; }
  .explore-reveal.show{ display:block; animation: popReveal .35s var(--ease-card) forwards; }

  /* ---- act widget (moment 8) ---- */
  .act-box{ margin-top:22px; opacity:0; animation: popReveal .5s var(--ease-card) forwards; animation-delay:.5s; }
  .act-note{ margin-top:12px; font-size:14.5px; color:var(--yellow); font-style:italic; display:none; }
  .act-note.show{ display:block; animation: beatPop .5s cubic-bezier(.34,1.56,.64,1) forwards; }

  /* ---- reflect pause ---- */
  .reflect-dots{ display:flex; gap:8px; margin-top:20px; opacity:.6; }
  .reflect-dots span{ width:6px; height:6px; border-radius:50%; background: var(--text-low);
    animation: dotPulse 1.4s ease-in-out infinite; }
  .reflect-dots span:nth-child(2){ animation-delay:.2s; }
  .reflect-dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes dotPulse{ 0%,100%{ opacity:.3;} 50%{ opacity:1;} }

  /* ---- field guide ---- */
  .fg-list{ width:100%; max-width:520px; text-align:left; display:flex; flex-direction:column; gap:10px; margin:18px 0 24px 0; }
  .fg-row{ display:flex; align-items:baseline; gap:10px; padding:10px 4px; border-bottom:1px solid rgba(255,255,255,0.06);
    opacity:0; animation: popReveal .4s var(--ease-card) forwards; }
  .fg-num{ font-family:'Space Grotesk', sans-serif; font-size:12px; color: var(--text-low); flex-shrink:0; width:20px; }
  .fg-text{ font-size:15.5px; color: var(--text-mid); }
  .fg-text b{ color:var(--yellow); font-weight:600; }

  .recap-grid{
    display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin: 22px 0 4px 0;
    padding: 4px;
  }
  .pill{
    font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:600;
    padding: 9px 16px; border-radius:999px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-mid);
    cursor:pointer;
    transition: all .25s cubic-bezier(.34,1.56,.64,1);

    animation: pillIn .45s cubic-bezier(.34,1.56,.64,1) forwards;

    opacity:0; animation: popReveal .6s var(--ease-card) forwards; animation-delay:.8s;

  .btn-row{ opacity:0; animation: popReveal .6s var(--ease-card) forwards; animation-delay:1s; }

  .tap-hint{

<script id="content-data" type="application/json">
{"homepage":{"title":"StartUp 101","supporting":"Nobody hands you a manual for this job. So we made one.","entryAction":"I'm in","microcopy":"20 minutes. No quiz. No certificate. Just the stuff nobody tells you on day one."},"intro":{"body":["You're working in a startup now.","That means a few things nobody's going to sit you down and explain, so we will.","Things move fast, and instructions won't always be perfect. Sometimes the person asking you for something is also still figuring it out. Priorities that felt fixed on Monday can be gone by Wednesday.","Nobody expects you to already know everything. But people will expect you to think — to notice what's off, ask when you're unsure, and take ownership of things nobody explicitly assigned to you.","That's not a personality trait. It's a set of habits. And like any habits, you can build them — mostly by knowing what they look like before you're standing in the middle of them.","So here's what we're going to do: we're going to walk you through 25 moments that are going to happen to you at work — probably sooner than you think. For each one, we'll show you what your instinct will probably tell you to do, and what a more experienced person would do instead."],"transitionToMoment1":"Let's start with one that happens to literally everyone, usually in their first week."},"moments":[{"number":1,"behavior":"Asking Questions","situation":"You don't understand an instruction.","card1":"There will be a time when someone gives you an instruction, and you don't fully understand it. Your instinct will be to nod, say ‘got it,’ and go figure it out on your own so you don’t look like you weren’t paying attention.\n\nDon’t.\n\nAsk the question.","card2":"Asking questions isn’t a sign you’re behind — it’s a sign you’re paying attention to the right thing: getting this right the first time. The fastest people in a startup aren’t the ones who never ask. They’re the ones who ask early, before they’ve built the wrong thing.","card3":"Your manager says, ‘Can you get me the numbers for the board deck?’ You could guess which numbers, for which period, in which format — and spend two hours guessing. Or you could ask: ‘Quick check — do you mean this month’s revenue by channel, or the full quarter?’ Thirty seconds now saves two wasted hours later.","card4":"When people don’t ask, they build the wrong thing confidently. Someone has to notice it’s wrong, explain what was actually needed, and wait for it to be redone. What could’ve been a thirty-second question becomes a half-day of rework — and a manager who now double-checks everything you hand them.","founder":"Nobody has ever fired someone for asking a clarifying question. Plenty of people have lost trust for confidently doing the wrong thing.","transition":"Asking questions gets you the right instructions. But what happens when there’s no instruction at all — when you’re just being asked to figure something out you’ve never done before?"},{"number":2,"behavior":"Curiosity","situation":"You've never done this before.","card1":"There will be a time when you’re asked to do something you’ve genuinely never done before. Your instinct might be to freeze, or to quietly hope someone notices and reassigns it.\n\nDon’t.\n\nGet curious.","card2":"Curiosity is what you do in the gap between ‘I don’t know this’ and ‘I need to know this.’ It means treating not-knowing as a starting point, not a dead end — Googling it, watching a video, asking someone who’s done it, taking the first small step before you feel ready.","card3":"You’re asked to set up a basic dashboard in a tool you’ve never opened. You could wait for someone to walk you through it. Or you could spend twenty minutes in the tool, watch one tutorial, and show up to the next conversation already halfway there — with real questions instead of ‘I don’t know where to start.’","card4":"When curiosity is missing, people wait. They wait for training that may never come, for someone with more time than they have, for permission to try. Meanwhile the task sits untouched, and the person who was counting on it starts wondering if they gave it to the wrong person.","founder":"Nobody expects you to already know everything. Startups run on people who are willing to not-know something at 9am and know it by 11.","transition":"Curiosity gets you started. Resourcefulness is what happens next — when curiosity actually turns into an answer."},{"number":3,"behavior":"Resourcefulness","situation":"You've found the answer yourself.","card1":"There will be a time when you go looking for an answer — searching, testing, piecing it together — and you actually find it. Your instinct might be to still ask someone to double-check it before you trust yourself.\n\nSometimes that’s right. Often, it isn’t necessary.\n\nUse what you found.","card2":"Resourcefulness means treating ‘I don’t know’ as temporary. It’s the muscle of finding things out instead of waiting to be handed them — old Slack threads, docs, half-finished spreadsheets, a five-minute search. It’s not about knowing everything. It’s about not stopping at not-knowing.","card3":"You need a number for a report and nobody’s around to ask. Instead of blocking on it, you check the last three reports, find the same figure was pulled from a specific dashboard, and pull it yourself. You note in your update: ‘Pulled this from the usual dashboard, same method as last month.’ Done.","card4":"When people default to waiting instead of digging, small unknowns become full stops. A single missing number can block an entire report. Someone eventually has to notice the delay, ask what’s holding it up, and realize the answer was one search away the whole time.","founder":"The answer being findable and the answer being handed to you are two different things. Get comfortable with the first one.","transition":"Once you’ve learned to find your own answers, the next question is bigger: do you wait for someone to tell you what to do next, or do you decide for yourself?"},{"number":4,"behavior":"Agency","situation":"You're waiting for someone to tell you what to do.","card1":"There will be a time when you finish what you were asked to do, and nobody has told you what’s next. Your instinct might be to sit and wait — it’s not your job to decide, right?\n\nDon’t wait.\n\nLook around and act.","card2":"Agency is deciding what to do without being told, based on what you can see needs doing. It doesn’t mean acting without judgment — it means not treating ‘nobody told me’ as a valid reason to do nothing.","card3":"You finish the task you were assigned an hour early. Instead of waiting for your manager to notice and assign the next thing, you check what’s on the team’s plate, pick something reasonable, and start — then say, ‘Finished early, so I started on X — let me know if you’d rather I switch.’","card4":"When agency is missing, capable people sit idle waiting for permission that was never required, while their manager — already stretched — has to remember to keep feeding them work. Momentum slows down for no real reason.","founder":"You don’t need a manager standing over you telling you what to do next. You need eyes, and the willingness to use them.","transition":"Agency means acting on what you can see. But sometimes you see something nobody assigned you to notice at all."},{"number":5,"behavior":"Initiative","situation":"You notice a problem nobody mentioned.","card1":"There will be a time when you notice something’s wrong — a bug, a broken link, a number that doesn’t add up — and it’s not officially your job to notice it. Your instinct might be to assume someone else already knows.\n\nDon’t assume.\n\nSay something.","card2":"Initiative means acting on what you notice, even outside your lane. It’s the difference between ‘that’s not my job’ and ‘someone should know about this’ — and you being the someone who says it.","card3":"You’re scrolling through the website and spot that the pricing page still shows last quarter’s numbers. It’s not your project. You could scroll past. Instead, you send a one-line message: ‘Heads up — pricing page still shows old numbers, flagging in case nobody’s seen it.’","card4":"When initiative is missing, small problems sit in plain sight — seen by several people, fixed by none, because everyone assumed it was someone else’s to catch. A customer eventually finds it before the team does.","founder":"‘Not my job’ has cost more startups money than almost any single bug ever has.","transition":"Noticing a problem is one thing. What happens when the problem — or the promise — is actually yours?"},{"number":6,"behavior":"Ownership","situation":"You promised something.","card1":"There will be a time when you tell someone, ‘I’ll have this to you by Friday.’ Then Friday gets busy. Your instinct might be to quietly let it slip and explain later if anyone asks.\n\nDon’t.\n\nProtect the promise — or say something before Friday arrives.","card2":"Ownership means a promise is a commitment, not a hope. It means the thing you said you’d do stays your responsibility until it’s actually done — not until it becomes inconvenient.","card3":"You told a colleague you’d send them the client brief by end of day. Your afternoon fills up with a fire drill. Ownership looks like messaging them at 4pm: ‘Still on for the brief, but it’ll be closer to 6 with everything going on today — that work?’ — not staying silent and hoping they don’t notice.","card4":"When ownership is missing, other people’s plans quietly break. The colleague waited all day assuming it was coming. Now they’re scrambling too — and next time, they build in extra buffer, because they’ve learned not to fully trust your word.","founder":"Your word is basically the only currency you have when you’re new. Spend it carefully.","transition":"Ownership means protecting your promises. But sometimes protecting them means telling someone, early, that you might not make it."},{"number":7,"behavior":"Giving Updates","situation":"You can't meet the deadline.","card1":"There will be a time when you realize you can’t meet a deadline. Your instinct will be to work quietly and hope you catch up before anyone notices.\n\nDon’t.\n\nGive an update.","card2":"Giving updates means telling people the truth about timing before they have to ask. In a startup, late information is often worse than late work — because it takes away everyone else’s ability to plan around you.","card3":"You were supposed to send a report by 3pm. At 1:30, you realize the data’s incomplete. Instead of disappearing into the problem, you send: ‘Quick update — missing the customer data for the final section. I can send the rest by 3, full report will likely land by 4. Checking with Finance now.’","card4":"When updates don’t come, people find out about delays the hard way — usually right when they needed the thing. Managers can’t plan, teammates can’t adjust, and a small, explainable delay turns into a surprise nobody had time to absorb.","founder":"Silence is information too — it just usually tells people the wrong thing.","transition":"Giving an update covers work in progress. What about work you’ve already finished?"},{"number":8,"behavior":"Closing the Loop","situation":"You've finished the task.","card1":"There will be a time when you finish something someone asked for. Your instinct might be to just move on — it’s done, they’ll see it eventually.\n\nDon’t leave it hanging.\n\nClose the loop.","card2":"Closing the loop means confirming completion out loud, not assuming it’s obvious. It’s a short message that turns ‘is this done?’ into something nobody ever has to ask.","card3":"You finish updating the onboarding doc your manager asked for last week. Instead of letting it sit in the shared folder, you send: ‘Updated the onboarding doc — added the new tool walkthrough, ready for review.’ Now it’s off both your plates.","card4":"When loops don’t close, people either forget the task was ever finished, or start following up to check — pulling both of you into a conversation a ten-second message would’ve prevented. Worse, sometimes work gets redone because nobody realized it was already done.","founder":"‘Done’ that lives only in your head doesn’t count yet. Say it out loud.","transition":"You now know how to handle one task well, start to finish. The next challenge is handling six of them at once."},{"number":9,"behavior":"Prioritization","situation":"Everything feels urgent.","card1":"There will be a time when everything on your list feels urgent at the same time. Your instinct might be to try to do all of it, a little at a time, and hope it works out.\n\nDon’t.\n\nDecide what actually matters most — and say so.","card2":"Prioritization means deciding what gets your attention first, based on real impact — not on what arrived last, or what’s loudest. It’s an active decision, not something that happens to you.","card3":"You have six things marked ‘urgent’ and your manager just sent a seventh. Instead of quietly trying to juggle all seven, you message: ‘I’ve got seven things flagged urgent right now — can you help me sequence these, or should I default to the customer bug first?’ You’re not stuck, you’re making the tradeoff visible.","card4":"When everything gets equal attention, nothing gets real attention. The task that actually mattered most gets the same rushed thirty minutes as the one that didn’t matter at all — and usually, it’s the important one that suffers, because it needed more than thirty minutes.","founder":"Busy and productive are not the same thing. Most people confuse them until someone points out the difference.","transition":"Prioritizing your own list is one skill. Reacting when something truly can’t wait is another."},{"number":10,"behavior":"Urgency","situation":"A customer issue appears suddenly.","card1":"There will be a time when a customer issue lands in your lap out of nowhere, mid-task. Your instinct might be to finish what you’re doing first, then get to it.\n\nDon’t.\n\nSome things genuinely can’t wait — learn to recognize which ones.","card2":"Urgency means correctly reading when something needs to jump the queue — and actually letting it. Not everything marked ‘urgent’ truly is, and not everything urgent gets labeled that way. This is judgment, not panic.","card3":"You’re deep in a task when a message comes in: a paying customer’s account is locked and they’re mid-demo with their own client. You pause what you’re doing, fix the lock, confirm with the customer, then go back to your original task. The original task waited twenty minutes. The customer didn’t have to.","card4":"When urgency isn’t recognized, small customer problems sit in a queue behind internal work that could’ve waited. The customer escalates, frustrated, and now what was a five-minute fix becomes a trust problem — plus an apology that takes longer than the fix would have.","founder":"You can always go back to your spreadsheet. You can’t always go back to a customer’s trust.","transition":"Sometimes urgency isn’t something you can handle alone. That’s when it’s time to ask for help."},{"number":11,"behavior":"Escalation","situation":"You're stuck and can't solve it.","card1":"There will be a time when you’re genuinely stuck — you’ve tried, and you still can’t solve it. Your instinct will be to keep trying quietly, because asking for help feels like admitting you can’t do your job.\n\nDon’t.\n\nEscalate.","card2":"Escalation means raising a problem before it grows, not after. It’s not giving up — it’s recognizing that some problems need more than one person’s time, and holding onto it alone just delays the moment someone finds out.","card3":"You’ve spent two hours trying to fix a bug you don’t fully understand. Instead of a third silent hour, you message a senior teammate: ‘Stuck on this bug — tried X and Y, no luck. Can I grab 10 minutes, or should I keep at it a bit longer?’ You’re back on track in fifteen minutes instead of losing the afternoon.","card4":"When escalation doesn’t happen, one stuck person quietly burns hours that a five-minute conversation could’ve saved — and the person who could’ve helped never even knew there was a problem to solve.","founder":"Asking for help isn’t the failure. Staying stuck and silent is.","transition":"Sometimes the help you need isn’t from your manager — it’s from a completely different team."},{"number":12,"behavior":"Collaboration","situation":"You need another team to help.","card1":"There will be a time when your work depends on another team — and getting their help feels like an extra hassle you’d rather avoid. Your instinct might be to work around them instead.\n\nDon’t.\n\nAsk directly, and make it easy for them to say yes.","card2":"Collaboration means treating other teams as partners in getting something done, not obstacles between you and the finish line. It’s asking clearly, with context, instead of assuming you’ll figure it out alone or hoping they’ll just notice you need them.","card3":"You need design’s help to finish a landing page. Instead of quietly building a rough version yourself and hoping it’s good enough, you message: ‘Working on the new landing page, need a hero image by Thursday — here’s the brief and reference examples. Does that timeline work?’ Now they can actually plan for it.","card4":"When people avoid collaboration, they end up duplicating work another team could’ve done better and faster, or shipping something weaker than it needed to be — and the team that could’ve helped never even knew they were needed.","founder":"You’re not bothering people by asking for help. You’re bothering them if you don’t, and they find out later that you needed it.","transition":"Collaboration works when everyone’s on the same page. But what happens when two people think they’re already aligned — and they’re not?"},{"number":13,"behavior":"Alignment","situation":"Two people have different understandings.","card1":"There will be a time when you and someone else walk out of the same conversation with two completely different understandings of what was agreed. Your instinct might be to assume your version is the right one.\n\nDon’t assume.\n\nCheck.","card2":"Alignment means confirming that everyone actually agrees on the same thing — out loud — instead of assuming agreement because a conversation happened. Two people can nod in the same meeting and leave with opposite plans.","card3":"After a planning call, you’re not totally sure if you or a teammate owns the client follow-up. Instead of assuming it’s theirs and moving on, you send: ‘Just to confirm — I’ve got the follow-up email, you’ve got the deck update, right?’ Thirty seconds. No dropped ball.","card4":"When alignment isn’t checked, both people proceed confidently in different directions. Something either gets done twice, or doesn’t get done at all — and it’s usually discovered at the worst possible moment, like right before it was due.","founder":"‘I thought we agreed’ is one of the most expensive sentences in a startup.","transition":"Alignment keeps work on track. But sometimes the thing you need to align on isn’t a task — it’s about you."},{"number":14,"behavior":"Feedback","situation":"Your manager gives feedback.","card1":"There will be a time when your manager tells you something you did wasn’t quite right. Your instinct might be to explain why, or feel like you’re being told you’re bad at your job.\n\nDon’t get defensive.\n\nListen first.","card2":"Taking feedback well means treating it as information about the work, not a verdict on you. It doesn’t mean agreeing with everything — it means genuinely hearing it before you respond.","card3":"Your manager says the client email you sent was too long and buried the ask. Your instinct is to explain you wanted to be thorough. Instead, you say: ‘Got it — I’ll lead with the ask next time and keep it tighter.’ You’ve kept the relationship intact and actually improved.","card4":"When feedback gets deflected instead of absorbed, managers slowly stop giving it — not because things are perfect, but because it’s not worth the friction. Then the same mistake happens again, and nobody said anything the second time either.","founder":"The people who grow fastest aren’t the ones who never get feedback. They’re the ones who don’t flinch when they get it.","transition":"How you handle feedback about yourself matters. So does how you handle conversations about other people."},{"number":15,"behavior":"Professionalism","situation":"People are gossiping about a colleague.","card1":"There will be a time when people around you are gossiping about a colleague — venting, complaining, maybe piling on. Your instinct might be to nod along, or add your own complaint.\n\nDon’t.\n\nStay out of it, or say something.","card2":"Professionalism here means not participating in conversations that tear people down behind their back. It doesn’t mean pretending everything’s fine — real issues should go to the person, or to someone who can actually help.","card3":"A few teammates start complaining about a colleague’s work in a group chat. Instead of adding to it, you say: ‘I hear you — might be worth raising it with them directly, or with [manager]?’ You’ve acknowledged the frustration without becoming part of the pile-on.","card4":"When gossip goes unchecked, trust erodes across the whole team — not just for the person being talked about, but for everyone, because people start wondering what’s said about them when they’re not in the room.","founder":"How you talk about people who aren’t in the room tells everyone exactly how you’ll talk about them when they aren’t.","transition":"Handling people well is one kind of maturity. Handling change well is another."},{"number":16,"behavior":"Adaptability","situation":"A plan changes halfway through.","card1":"There will be a time when a plan you’ve already started changes halfway through — a new priority, a customer request, a founder’s change of mind. Your instinct might be to resent the wasted effort.\n\nDon’t dig in.\n\nAdjust.","card2":"Adaptability means holding onto the goal, not the original plan. Startups change direction often, sometimes for good reasons you don’t see yet. Being able to pivot without losing momentum is a real skill, not a personal defeat.","card3":"You’ve spent two days building a feature a certain way. Your manager says the approach needs to change based on new customer feedback. Instead of arguing that you already built it the other way, you ask: ‘Got it — what’s different about the new direction so I build the right thing this time?’ and move.","card4":"When people resist change, momentum stalls twice — once while they push back, and again while they catch up anyway, because the change was happening regardless. Nothing was saved by the resistance except goodwill.","founder":"The plan was never sacred. The outcome is.","transition":"Adapting to change is one thing. Operating when there was never a clear plan to begin with is another."},{"number":17,"behavior":"Managing Ambiguity","situation":"There is no clear process.","card1":"There will be a time when you’re given something to do and there’s no clear process for it — because nobody’s done it before. Your instinct might be to wait until someone defines the steps.\n\nDon’t wait.\n\nMake your best call and move.","card2":"Managing ambiguity means acting with incomplete information instead of stalling until it’s complete. In a startup, waiting for a perfect process often means waiting forever — someone has to make the first attempt.","card3":"You’re asked to set up the company’s first customer feedback survey. There’s no template, no past example. Instead of waiting for guidance that doesn’t exist yet, you draft a version based on what similar companies do, share it with a note — ‘First pass, open to changes’ — and let the team react to something real instead of nothing.","card4":"When people wait for clarity that isn’t coming, work simply doesn’t happen. The task sits, the deadline arrives, and everyone’s left further behind than if an imperfect first attempt had existed for people to react to.","founder":"Nobody has the process for the thing that’s never been done. You’re not behind for not knowing it — you’re ahead if you’re willing to build it.","transition":"Operating in ambiguity eventually means making an actual call. So — how do you decide?"},{"number":18,"behavior":"Decision Making","situation":"You need to make a decision.","card1":"There will be a time when a decision lands on you and there’s no obviously right answer. Your instinct might be to delay it, or push it back up to someone else.\n\nDon’t avoid it.\n\nMake the call with what you have.","card2":"Decision making means choosing with the information available, not the information you wish you had. It’s not about being right every time — it’s about being willing to decide instead of freezing or offloading it.","card3":"You need to pick between two vendors and neither is a perfect fit. Instead of sending your manager a long comparison and waiting, you write: ‘Going with Vendor B — better response time, worse pricing, but speed matters more for us right now. Flag if you disagree.’ You’ve decided and left room to be corrected.","card4":"When decisions get endlessly delayed, the team loses time waiting for certainty that was never coming — and often, someone else has to step in and decide anyway, on a tighter deadline, with less information than you had.","founder":"A good decision made today usually beats a perfect decision made next week.","transition":"Sometimes the hardest decision isn’t what to do — it’s whether to say something your manager doesn’t want to hear."},{"number":19,"behavior":"Respectful Disagreement","situation":"You disagree with your manager.","card1":"There will be a time when your manager decides something and you genuinely disagree. Your instinct might be to stay quiet and go along with it.\n\nDon’t just comply.\n\nSay what you actually think — respectfully.","card2":"Respectful disagreement means voicing a different view clearly, without making it personal, and without needing to win. Once you’ve said it and a decision is made, you commit to it fully — even if it’s not the one you argued for.","card3":"Your manager wants to launch a feature you think isn’t ready. Instead of staying quiet, you say: ‘I think launching now risks X — happy to be overruled, wanted to flag it before we go.’ They decide to launch anyway. You support the launch fully, because you said your piece.","card4":"When disagreement goes unspoken, bad decisions ship uncontested — and the person who saw the problem coming says ‘I knew this would happen’ afterward instead of before, when it could’ve actually helped.","founder":"I’d rather you tell me I’m wrong and be overruled than agree with me and be right in silence.","transition":"Disagreement is about decisions. Accountability is about what happens after one goes wrong."},{"number":20,"behavior":"Accountability","situation":"You made a mistake.","card1":"There will be a time when you make a mistake — a real one, with real consequences — and nobody knows yet. Your instinct might be to quietly try to fix it before anyone finds out.\n\nDon’t hide it.\n\nOwn it.","card2":"Accountability means naming your own mistake before someone else finds it. It’s not about punishment — it’s about giving people the chance to help or adjust while there’s still time, instead of finding out later, from someone else.","card3":"You accidentally send a customer the wrong contract with the wrong pricing. Instead of hoping they don’t notice, you tell your manager immediately: ‘I sent the wrong version to [customer] — here’s what happened, here’s what I’m doing to fix it.’ It’s uncomfortable for ten minutes. It builds trust for a lot longer than that.","card4":"When mistakes get hidden, they don’t stay small. They surface later, at a worse time, discovered by someone else — and now the story isn’t just ‘a mistake happened,’ it’s ‘a mistake happened and you didn’t say anything.’ That second part is what actually costs trust.","founder":"I’ve never lost respect for someone who told me they messed up. I’ve lost respect for people who let me find out on my own.","transition":"Owning a mistake is one kind of maturity. Working well within real limits — money, time, people — is another."},{"number":21,"behavior":"Resourcefulness","situation":"You're working with limited resources.","card1":"There will be a time when you don’t have what you’d ideally want — not enough budget, not enough people, not enough time. Your instinct might be to treat that as a reason to stop.\n\nDon’t wait for ideal conditions.\n\nWork with what’s actually there.","card2":"This kind of resourcefulness means making real progress inside real limits, instead of treating the limit as a full stop. It’s the difference between ‘we can’t do this properly’ and ‘here’s what we can do with what we’ve got.’","card3":"You’re asked to run a customer research project with no budget for incentives and one week instead of three. Instead of pushing back that it’s not enough, you cut the sample size, use existing customer relationships instead of paid recruiting, and deliver a smaller but real set of insights on time.","card4":"When constraints are treated as blockers, projects simply don’t happen — not because they were impossible, but because nobody tried the smaller, scrappier version that was actually achievable.","founder":"Startups rarely have enough of anything. The people who do well here are the ones who don’t wait for enough.","transition":"Working within limits solves today’s problem. But some problems keep coming back — and that’s a different kind of signal."},{"number":22,"behavior":"Systems Thinking","situation":"You keep solving the same problem.","card1":"There will be a time when you realize you’ve fixed the exact same problem for the third time this month. Your instinct might be to just fix it again — it’s faster than stopping to think.\n\nDon’t just fix it again.\n\nAsk why it keeps happening.","card2":"Systems thinking means noticing patterns, not just incidents. It’s stepping back from the immediate fire to ask what keeps causing it — and fixing that, even if it takes longer than fixing the fire in front of you.","card3":"You’ve manually corrected the same data error in a report three weeks running. Instead of fixing it a fourth time, you trace it back to a broken formula upstream, fix that instead, and mention it in your update: ‘Fixed the root cause — this shouldn’t need manual correction again.’","card4":"When only symptoms get fixed, the same problem quietly eats time forever — a little bit each week, invisible in any single instance, enormous over a year. Nobody notices the cost because it never shows up as one big number.","founder":"If you’re fixing the same thing for the third time, you’re not actually fixing it. You’re renting time from the real problem.","transition":"Fixing the root cause matters internally. It matters even more when the problem is something a customer can actually feel."},{"number":23,"behavior":"Customer Thinking","situation":"A customer is affected by your work.","card1":"There will be a time when a task you’re doing — a bug fix, a delay, a decision — actually affects a real customer on the other end. Your instinct might be to think about it purely as a task to close.\n\nDon’t lose sight of who it’s for.","card2":"Customer thinking means remembering there’s a real person affected by your work, even when the task itself feels internal and abstract. It changes how you prioritize, how fast you move, and how you explain a delay.","card3":"A bug means a small group of customers can’t export their data. Internally, it’s a low-priority ticket. But you know two of those customers are mid-way through a deadline of their own. Instead of leaving it in the general queue, you flag it: ‘This is blocking [customer]’s deadline this week — can we bump it up?’","card4":"When customer impact gets lost behind internal process, technically-correct prioritization quietly damages real relationships. The team feels like it’s operating fine — tickets closing, sprints on track — while a customer is having a genuinely bad week because of it.","founder":"Every ticket, bug, and delay has a person on the other end of it. Never let the internal process make you forget that.","transition":"Thinking about the customer matters. So does making sure the person waiting on you actually hears from you."},{"number":24,"behavior":"Communication","situation":"Someone is waiting for information from you.","card1":"There will be a time when someone is genuinely stuck, waiting on information only you have. Your instinct might be to get to it when you get to it — you’re busy too.\n\nDon’t sit on it.\n\nYou’re the blocker right now.","card2":"Communication here means recognizing when you’re the thing standing between someone and their next step — and treating that with urgency, even if the ask itself feels small to you.","card3":"A teammate messages asking for a password to a shared account they need for a client call in twenty minutes. You’re mid-task and could easily let it sit for an hour. Instead, you send it in two minutes, because you recognize the twenty-minute window matters more than your current task order.","card4":"When people don’t recognize they’re the blocker, small requests turn into stalled work for someone else — a whole task, sometimes a whole team, paused because one small reply didn’t come fast enough.","founder":"The message that takes you thirty seconds to answer might be the thing standing between someone else and their entire day.","transition":"Responding quickly is half of communication. Being understood is the other half — and that’s its own skill."},{"number":25,"behavior":"Clarity","situation":"You need to explain something clearly.","card1":"There will be a time when you need to explain something — a problem, an update, a plan — to someone who doesn’t have the context you do. Your instinct might be to explain it the way you understood it, in the order you figured it out.\n\nDon’t.\n\nLead with what they actually need to know.","card2":"Clarity means structuring what you say around the listener, not around your own thought process. It means leading with the headline, then the detail — not building up to the point after five minutes of context.","card3":"You spent all day untangling a data issue. Instead of walking your manager through the whole investigation in order, you lead with: ‘The dashboard numbers were wrong because of a broken filter — fixed now, here’s what caused it if you want the detail.’ They get what they need in one sentence, with more available if they want it.","card4":"When explanations aren’t structured for the listener, people either tune out halfway through or walk away with the wrong takeaway — and have to ask follow-up questions to get to the point that should’ve come first.","founder":"You did the hard work of figuring it out. Don’t make the other person do the hard work of following you through it. Just hand them the answer.","transition":"Twenty-five moments in, and here’s the thing — you’re not going to remember all of this perfectly on Monday morning. Nobody does. But something’s different now."}],"outro":{"body":["Startup work isn’t a script. It’s a series of moments like the ones you just walked through — most of them small, none of them dramatic on their own, all of them adding up to what people mean when they call someone ‘good to work with.’","You won’t get all twenty-five right, every time. Nobody does — including the people who wrote this.","But you’ll recognize the moment when it shows up. You’ll know what the instinct is, and you’ll know what a more experienced version of you would do instead. That gap — between instinct and judgment — is basically the whole job.","You’re not finishing a training. You’re just starting the part where it actually counts."],"closer":"Go do the thing."}}
</script>

<script>
/* =========================================================

const ATMO = {
  welcome:   { bg:['#241a3d','#0b1020'], particle:[196,181,253], accentA:'#8B5CF6', accentB:'#0090FF', motion:'wander', polarity:'swirl',       orderBias: 0.05, pulse:2.6, blur:20, density:1.00 },
  confusion: { bg:['#1b1330','#0b1020'], particle:[167,139,250], accentA:'#8B5CF6', accentB:'#a78bfa', motion:'wander', polarity:'swirl',       orderBias:-0.30, pulse:1.9, blur:22, density:1.05 },
  ambiguity: { bg:['#1a1330','#0b1020'], particle:[196,181,253], accentA:'#8B5CF6', accentB:'#0090FF', motion:'fog',    polarity:'swirl',       orderBias:-0.20, pulse:2.2, blur:24, density:1.10 },
  pressure:  { bg:['#0c0e1c','#05060c'], particle:[ 91,111,168], accentA:'#5b6fa8', accentB:'#8B5CF6', motion:'sink',   polarity:'repel',       orderBias:-0.10, pulse:1.1, blur: 8, density:0.88 },
  urgency:   { bg:['#170b13','#0b1020'], particle:[255,107,107], accentA:'#ff6b6b', accentB:'#FFD000', motion:'streak', polarity:'repel',       orderBias:-0.05, pulse:0.5, blur: 2, density:0.80 },
  momentum:  { bg:['#0b1730','#0b1020'], particle:[ 77,184,255], accentA:'#0090FF', accentB:'#8B5CF6', motion:'flow',   polarity:'attractSoft', orderBias: 0.05, pulse:1.3, blur: 6, density:0.95 },
  ownership: { bg:['#1c1330','#0b1020'], particle:[139, 92,246], accentA:'#8B5CF6', accentB:'#4db8ff', motion:'orbit',  polarity:'attractSoft', orderBias: 0.15, pulse:2.0, blur:10, density:1.00 },
  alignment: { bg:['#0b1830','#0b1020'], particle:[ 77,184,255], accentA:'#0090FF', accentB:'#8B5CF6', motion:'grid',   polarity:'attract',     orderBias: 0.35, pulse:1.6, blur: 6, density:1.00 },
  recovery:  { bg:['#241407','#0b1020'], particle:[255,184, 77], accentA:'#FFD000', accentB:'#8B5CF6', motion:'reform', polarity:'attractSoft', orderBias: 0.05, pulse:1.7, blur:14, density:1.00 },
  confidence:{ bg:['#1a1330','#0b1020'], particle:[255,208,  0], accentA:'#FFD000', accentB:'#8B5CF6', motion:'orbit',  polarity:'attract',     orderBias: 0.50, pulse:2.6, blur: 4, density:1.08 },
  clarity:   { bg:['#0b1220','#05070f'], particle:[230,240,255], accentA:'#0090FF', accentB:'#FFD000', motion:'grid',   polarity:'attract',     orderBias: 0.65, pulse:3.0, blur: 0, density:1.15 },
  resolved:  { bg:['#241a06','#1c1330'], particle:[255,208,  0], accentA:'#FFD000', accentB:'#8B5CF6', motion:'orbit',  polarity:'attract',     orderBias: 0.80, pulse:3.2, blur: 0, density:1.12 }
};

const MOMENT_ATMO = {
  1:'confusion', 2:'ambiguity', 3:'momentum', 4:'momentum', 5:'momentum',
  6:'ownership', 7:'pressure', 8:'clarity', 9:'pressure', 10:'urgency',
  11:'pressure', 12:'alignment', 13:'alignment', 14:'clarity', 15:'alignment',
  16:'momentum', 17:'ambiguity', 18:'confidence', 19:'alignment', 20:'recovery',
  21:'momentum', 22:'clarity', 23:'ownership', 24:'alignment', 25:'confidence'
};

/* Card 3 (In Practice) gets a behavior-specific overlay on top of the
   atmosphere: competing paths, a traveling signal, or a repeating loop --
   the interface visually rehearses the behavior, not just colors it. */
const PRACTICE_OVERLAY = {
  1:'signal', 2:'loop', 3:'paths', 4:'paths', 5:'signal',
  6:'none', 7:'signal', 8:'loop', 9:'paths', 10:'paths',
  11:'signal', 12:'signal', 13:'signal', 14:'signal', 15:'signal',
  16:'loop', 17:'loop', 18:'paths', 19:'signal', 20:'none',
  21:'paths', 22:'loop', 23:'signal', 24:'signal', 25:'paths'
};

/* Card 4 (Consequence) makes the world react -- not decoration, a
   response to what just happened. */
const CONSEQUENCE_REACTION = {
  7:'freeze', 8:'stabilize', 9:'noise', 10:'break', 11:'freeze',
  13:'break', 20:'stabilize', 24:'break', 25:'stabilize'
};
function reactionFor(n){ return CONSEQUENCE_REACTION[n] || 'dim'; }
function layoutFor(n){ return ['layout-center','layout-left','layout-wide'][(n-1) % 3]; }

/* =========================================================
   WORLD-BUILDING LAYERS
   Cultural context inserted between clusters of moments --
   not new lessons, pattern breaks that reinforce what the
   participant has already lived through.
   ========================================================= */
const STARTUP_TRUTHS = [
  { atmo:'ambiguity', lines:["The map is incomplete.", "Nobody has all the instructions.",
    "That's not always poor management \u2014 sometimes the company is dealing with something it's never dealt with before.",
    "The instructions are being written while the work is happening.", "That's startup work."] },
  { atmo:'momentum', lines:["Change isn't an interruption.", "In startups, change is often the environment itself.",
    "The plan changing doesn't always mean something went wrong.", "Sometimes it means the company learned something."] },
  { atmo:'recovery', lines:["Your work travels further than you think.", "In a small team, small actions have bigger consequences.",
    "A missed update affects someone. A delayed decision affects a customer.",
    "A problem you notice early can prevent something much bigger."] },
  { atmo:'resolved', lines:["Eventually, you stop seeing tasks.", "And start seeing the system."] }
];

const FOUNDER_TRANSLATIONS = [
  { atmo:'ownership', phrase:"\u201cI need you to take more ownership.\u201d",
    body:["Doesn't necessarily mean work more.", "It often means: don't stop thinking just because your assigned task is complete."] },
  { atmo:'alignment', phrase:"\u201cBe more proactive.\u201d",
    body:["Often means: don't wait for the problem to become obvious before noticing it."] },
  { atmo:'momentum', phrase:"\u201cMove faster.\u201d",
    body:["Doesn't mean panic, or skip thinking.", "It often means: reduce unnecessary waiting."] }
];

const MYTH_REALITY = [
  { atmo:'confusion', myth:"Startups have no structure.",
    reality:["Startups often have less established structure.", "Which means someone has to build it.", "Sometimes, that's you."] },
  { atmo:'pressure', myth:"Startup people simply work harder.",
    reality:["Good startup teams don't just work harder.", "They reduce unnecessary waiting."] }
];

const THINGS_HEARD = [
  { atmo:'urgency', phrase:"\u201cLet's move fast.\u201d",
    meaning:["Usually doesn't mean rush blindly.", "It means: stop waiting unnecessarily."] },
  { atmo:'clarity', phrase:"\u201cWho owns this?\u201d",
    meaning:["Usually means a problem exists.", "Someone needs to make sure it doesn't remain just a conversation."] }
];

// what gets inserted right after which moment number finishes its 4 cards
const INSERT_AFTER_MOMENT = {
  5:  [{ kind:'truth', data: STARTUP_TRUTHS[0] }],
  8:  [{ kind:'translation', data: FOUNDER_TRANSLATIONS[0] }],
  9:  [{ kind:'heard', data: THINGS_HEARD[0] }],
  10: [{ kind:'myth', data: MYTH_REALITY[0] }],
  13: [{ kind:'translation', data: FOUNDER_TRANSLATIONS[1] }],
  16: [{ kind:'truth', data: STARTUP_TRUTHS[1] }],
  18: [{ kind:'myth', data: MYTH_REALITY[1] }],
  20: [{ kind:'truth', data: STARTUP_TRUTHS[2] }],
  21: [{ kind:'translation', data: FOUNDER_TRANSLATIONS[2] }],
  22: [{ kind:'heard', data: THINGS_HEARD[1] }]
};
// inserted BEFORE a moment's situation card starts
const INSERT_BEFORE_MOMENT = {
  20: [{ kind:'reflect-pause' }]
};

const AFTERMATH_LINES = [
  { text:"So.", size:'hero' },
  { text:"You've made it through 25 moments.", size:'normal' },
  { text:"No quiz. No score. No certificate. Because that's not really the point.", size:'sub' },
  { text:"The point is what happens next.", size:'normal' },
  { text:"Tomorrow, one of these moments will happen again. You won't understand something. Something will change. A customer will have a problem. A teammate will be waiting. You'll notice something. You'll make a mistake.", size:'sub' },
  { text:"And maybe \u2014 you'll catch yourself. Right in the middle of it.", size:'normal' },
  { text:"\u201cOh. This is one of those moments.\u201d", size:'hero' },
  { text:"That's when StartUp 101 actually begins.", size:'normal' }
];

const FIELD_GUIDE = [
  "When you don't know \u2192 <b>Ask.</b>",
  "When there's no answer \u2192 <b>Explore.</b>",
  "When nobody tells you \u2192 <b>Look around.</b>",
  "When something's wrong \u2192 <b>Say something.</b>",
  "When you promise \u2192 <b>Follow through.</b>",
  "When you're behind \u2192 <b>Give an update.</b>",
  "When you finish \u2192 <b>Close the loop.</b>",
  "When everything feels urgent \u2192 <b>Think first.</b>",
  "When people depend on you \u2192 <b>Keep them informed.</b>",
  "When things change \u2192 <b>Adjust.</b>",
  "When you make a mistake \u2192 <b>Own it.</b>",
  "When you're stuck \u2192 <b>Ask for help.</b>"
];

const DATA = JSON.parse(document.getElementById('content-data').textContent);
const { homepage, intro, moments, outro } = DATA;

const screens = [];
screens.push({ type:'homepage' });
intro.body.forEach((line, i) => screens.push({ type:'intro-line', text: line, isFirst: i===0 }));
screens.push({ type:'intro-transition', text: intro.transitionToMoment1 });
moments.forEach((m) => {
  (INSERT_BEFORE_MOMENT[m.number] || []).forEach(ins => screens.push(breakScreenFor(ins)));
  screens.push({ type:'situation', m });
  screens.push({ type:'definition', m });
  screens.push({ type:'practice', m });
  screens.push({ type:'consequence', m });
  (INSERT_AFTER_MOMENT[m.number] || []).forEach(ins => screens.push(breakScreenFor(ins)));
});
AFTERMATH_LINES.forEach(l => screens.push({ type:'aftermath-line', text:l.text, size:l.size }));
screens.push({ type:'fieldguide' });
screens.push({ type:'ending' });

function breakScreenFor(ins){
  if (ins.kind === 'truth') return { type:'truth', atmo: ins.data.atmo, lines: ins.data.lines };
  if (ins.kind === 'translation') return { type:'translation', atmo: ins.data.atmo, phrase: ins.data.phrase, body: ins.data.body };
  if (ins.kind === 'myth') return { type:'myth', atmo: ins.data.atmo, myth: ins.data.myth, reality: ins.data.reality };
  if (ins.kind === 'heard') return { type:'heard', atmo: ins.data.atmo, phrase: ins.data.phrase, meaning: ins.data.meaning };
  if (ins.kind === 'reflect-pause') return { type:'reflect-pause', atmo:'recovery', focus:true };
}

const firstMomentIdx = screens.findIndex(s => s.type === 'situation');
const lastMomentIdx = screens.map((s,i)=>s.m ? i : -1).filter(i=>i>=0).pop();

let idx = 0;

function escapeHtml(str){ return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderBodyParas(text, baseDelay){
  baseDelay = baseDelay || 0.05;
  const chunks = text.split('\n\n');
  return chunks.map((c, i) => {
    const wordCount = c.trim().split(/\s+/).length;
    const isBeat = wordCount <= 4 && i > 0;
    const delay = (baseDelay + i * 0.14).toFixed(2);
    return `<p class="${isBeat ? 'beat' : ''}" style="animation-delay:${delay}s">${escapeHtml(c)}</p>`;
  }).join('');
}

function findClosingQuote(text, from){
  let i = from;
  while (true){
    i = text.indexOf('\u2019', i);
    if (i === -1) return -1;
    const nextChar = text[i+1];
    if (!nextChar || !/[a-zA-Z]/.test(nextChar)) return i;
    i++;
  }
}
function extractQuote(text){
  let searchFrom = 0, lastMatch = null;
  while (true){
    const colonQuoteIdx = text.indexOf(': \u2018', searchFrom);
    if (colonQuoteIdx === -1) break;
    const openQ = colonQuoteIdx + 2;
    const closeQ = findClosingQuote(text, openQ + 1);
    if (closeQ !== -1) lastMatch = { openQ, closeQ };
    searchFrom = colonQuoteIdx + 1;
  }
  if (lastMatch) return lastMatch;
  const openQ = text.indexOf('\u2018');
  if (openQ === -1) return null;
  const closeQ = findClosingQuote(text, openQ + 1);
  if (closeQ === -1) return null;
  return { openQ, closeQ };
}
function renderPractice(text){
  const q = extractQuote(text);
  if (!q) return `<p style="animation-delay:.05s">${escapeHtml(text)}</p>`;
  const before = text.slice(0, q.openQ);
  const quoted = text.slice(q.openQ + 1, q.closeQ);
  const after = text.slice(q.closeQ + 1);
  let html = '';
  if (before.trim()) html += `<p style="animation-delay:.05s">${escapeHtml(before)}</p>`;
  html += `<div class="bubble">${escapeHtml(quoted)}</div>`;
  if (after.trim()) html += `<p style="animation-delay:.35s">${escapeHtml(after)}</p>`;
  return html;
}

function momentProgress(screenIndex){
  const s = screens[screenIndex];
  return s.m ? s.m.number : null;
}

function mascot(cls){ return `<div class="mascot ${cls}"><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="mouth"></div></div>`; }

function exploreWidget(){
  return `
    <div class="explore-box">
      <div class="explore-label">Explore &mdash; tap the underlined parts</div>
      <div class="explore-instruction">&ldquo;Can you <span class="explore-hot" onclick="revealExplore(this,0)">sort out</span> <span class="explore-hot" onclick="revealExplore(this,1)">the onboarding thing</span> before <span class="explore-hot" onclick="revealExplore(this,2)">Friday</span>?&rdquo;</div>
      <div class="explore-reveal" id="er-0">What does "sort out" actually mean here \u2014 fix it, document it, finish it?</div>
      <div class="explore-reveal" id="er-1">Which specific part of onboarding? There could be five different things this refers to.</div>
      <div class="explore-reveal" id="er-2">Friday morning, or end of day Friday? Those are very different deadlines.</div>
    </div>
  `;
}
function revealExplore(el, i){
  el.style.color = 'var(--text-hi)';
  const r = document.getElementById('er-'+i);
  if (r) r.classList.add('show');
}

function actWidget(){
  return `
    <div class="act-box">
      <button class="cta secondary" style="animation:none;" onclick="markDone(this)">Mark Done &#10003;</button>
      <div class="act-note" id="act-note">They don't know you're done yet.</div>
    </div>
  `;
}
function markDone(el){
  el.disabled = true;
  el.style.opacity = '.5';
  const note = document.getElementById('act-note');
  setTimeout(() => { if (note) note.classList.add('show'); }, 350);
}

function atmosphereForScreen(screenIndex){
  const s = screens[screenIndex];
  if (s.atmo) return s.atmo;
  if (s.type === 'homepage' || s.type.startsWith('intro')) return 'welcome';
  if (s.type === 'aftermath-line') return 'confidence';
  if (s.type === 'fieldguide') return 'clarity';
  if (s.type === 'ending') return 'resolved';
  return MOMENT_ATMO[s.m.number] || 'ambiguity';
}

function orderForScreen(screenIndex){
  const s = screens[screenIndex];
  let base;
  if (s.type === 'homepage') base = 0.05;
  else if (s.type.startsWith('intro')) base = 0.08;
  else if (s.type === 'aftermath-line') base = 0.9;
  else if (s.type === 'fieldguide') base = 0.95;
  else if (s.type === 'ending') base = 1.0;
  else base = 0.15 + ((screenIndex - firstMomentIdx) / (lastMomentIdx - firstMomentIdx)) * 0.72;
  const atmoKey = atmosphereForScreen(screenIndex);
  return Math.max(0, Math.min(1, base + ATMO[atmoKey].orderBias));
}

/* ---------- render loop / screen change ---------- */

let activeBg = 'A';
function setBg(colors){
  const inactive = activeBg === 'A' ? document.getElementById('bgB') : document.getElementById('bgA');
  const active = activeBg === 'A' ? document.getElementById('bgA') : document.getElementById('bgB');
  inactive.style.background = `radial-gradient(ellipse at 50% 30%, ${colors[0]} 0%, ${colors[1]} 65%)`;
  requestAnimationFrame(() => {
    inactive.classList.add('active');
    active.classList.remove('active');
  });
  activeBg = activeBg === 'A' ? 'B' : 'A';
}

function applyAtmosphere(key){
  const a = ATMO[key];
  document.documentElement.style.setProperty('--pulse-speed', a.pulse + 's');
  document.documentElement.style.setProperty('--pulse-fast', (a.pulse*0.55).toFixed(2) + 's');
  document.documentElement.style.setProperty('--card-blur', a.blur + 'px');
  document.documentElement.style.setProperty('--card-density', a.density);
  document.documentElement.style.setProperty('--accent-a', a.accentA);
  document.documentElement.style.setProperty('--accent-b', a.accentB);
  setBg(a.bg);
  atmoSystem.setTarget(a);
}

let transitioning = false;
